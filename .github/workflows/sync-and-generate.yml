name: Sync Upstream & Generate List

on:
  schedule:
    - cron: '0 2 * * *'          # 每天 UTC 02:00（北京时间 10:00）
  push:
    branches: [sing]
    paths:
      - 'my_custom_rules/**.txt'
  workflow_dispatch:

jobs:
  sync-and-convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5          # 升级到 v5，消除 Node.js 20 警告
        with:
          ref: sing
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync upstream geo only
        run: |
          git remote add upstream https://github.com/MetaCubeX/meta-rules-dat.git || true
          git fetch upstream sing
          # 只同步 geo 目录，绝不覆盖 my_custom_rules
          git checkout upstream/sing -- geo

      - name: Setup Python
        uses: actions/setup-python@v6      # 升级到 v6
        with:
          python-version: '3.12'

      - name: Download sing-box
        run: |
          SINGBOX_VERSION=$(curl -sL https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep '"tag_name"' | head -n1 | cut -d'"' -f4 | sed 's/v//')
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box-*.tar.gz --strip-components=1
          chmod +x sing-box

      - name: Convert files
        run: python3 convert.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geo/ my_custom_rules/
          git diff --staged --quiet || git commit -m "chore: sync geo & generate list files $(date +'%Y-%m-%d %H:%M')"
          git push origin sing
